<style>

h:100%;border-radius:20px;padding:24px;color:#fff;background:radial-gradient(ellipse at 85% 0%,#a9bc95 0,transparent 65%),linear-gradient(145deg,#536c54,#294738);position:relative;overflow:hidden;min-height:220px}.hero .hint{color:#e4ecdf}.hero h3{font-size:21px;font-weight:500;margin:14px 0 0}.hero .num{font-size:64px;line-height:1.25;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-2px}.hero .unit{font-size:16px;margin-left:8px}.hero .message{margin:12px 0 0;max-width:270px;font-size:13px;color:#edf0e6}.hero .detaildate{font-size:12px;margin-top:6px;color:#e4ecdf}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:24px 0 8px}.sectionhead h3{font-size:16px;font-weight:600;margin:0}.textbtn{background:none;border:0;color:var(--green);padding:8px;min-height:44px}.row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);width:100%;background:transparent;border-left:0;border-top:0;border-right:0;text-align:left;min-height:64px}.row .body{flex:1;min-width:0}.row h4{font-size:14px;font-weight:500;margin:0 0 3px}.row p{margin:0;font-size:12px;color:var(--muted)}.count{text-align:right;font-size:21px;font-weight:500}.count small{font-size:11px;color:var(--muted);display:block}.tile{width:38px;height:42px;border-radius:10px;background:var(--soft);color:var(--green);display:grid;place-items:center;font-size:18px}.nav{background:var(--surface);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 8px 12px;border-top:1px solid var(--line)}.nav button{border:0;background:none;min-height:48px;color:var(--muted);font-size:12px;display:grid;justify-items:center;gap:3px}.nav button.active{color:var(--green);font-weight:600}.nav span{font-size:20px;line-height:1}.primary{background:var(--green);color:#fff;border:0;border-radius:12px;padding:13px 18px;min-height:48px;width:100%}.secondary{background:var(--surface);color:var(--green);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:48px;width:100%}.actions{display:flex;gap:10px;margin-top:18px}.actions>*{flex:1}.panel{padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:12px 0}.panel h3{font-size:15px;margin:0 0 8px}.panel p{margin:4px 0}.panel .row:last-child{border:0;padding-bottom:2px}.label{display:block;font-weight:500;font-size:13px;margin:18px 0 7px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;min-height:46px}textarea{min-height:105px;resize:vertical}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:14px}.badge{font-size:11px;padding:3px 7px;border-radius:6px;background:var(--soft);color:var(--green)}.badge.warn{background:#f4ead9;color:var(--warn)}.progress{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;margin:14px 0}.progress span{display:block;width:33%;height:100%;background:var(--green)}.quote{font-size:15px;line-height:1.9;margin:10px 0;white-space:pre-line}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;margin-top:14px}.calendar span,.calendar button{border:0;border-radius:50%;height:38px;display:grid;place-items:center;background:none;font-size:13px}.calendar .dow{color:var(--muted);font-size:11px}.calendar .out{color:#8b938b}.calendar .today{background:var(--green);color:#fff}.calendar .event{background:var(--soft);color:var(--green);position:relative}.calendar .event:after{content:"";width:3px;height:3px;background:var(--green);position:absolute;bottom:3px;border-radius:50%}.note{padding:12px 0;color:var(--muted);font-size:12px}.warning{color:var(--warn);background:#f5eddd;border-radius:10px;padding:12px;font-size:12px}.setting{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}.switch{width:42px;height:24px;background:#bec9bc;border:0;border-radius:20px;padding:3px}.switch:before{content:"";display:block;border-radius:50%;height:18px;width:18px;background:#fff}.switch[aria-checked=true]{background:var(--green)}.switch[aria-checked=true]:before{margin-left:18px}.statline{display:flex;justify-content:space-between;margin:7px 0;font-size:13px}.bookgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.book{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;min-height:116px}.book h3{margin:12px 0 4px;font-size:16px}.book p{margin:0;color:var(--muted);font-size:12px}.illustration{height:180px;margin:24px 0;display:grid;place-items:center;background:var(--soft);border-radius:20px}.onboardmark{width:100px;height:120px;background:#fff;border-radius:14px;box-shadow:8px 10px 0 #c3d2bd;color:var(--green);text-align:center;padding:18px;font-size:40px}.onboardmark small{display:block;font-size:12px}.notes h3{margin:0 0 12px;font-size:16px}.notes{font-size:13px;padding-top:16px}.notes code{background:#fff;padding:2px 5px;border-radius:4px;font-size:11px;overflow-wrap:anywhere}.notes ul{padding-left:18px;color:var(--muted)}.notes li{margin:10px 0}#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);max-width:90%;padding:12px 20px;border-radius:10px;background:#26332c;color:white;box-shadow:0 6px 24px #0003;z-index:10;display:none}.tree{margin-left:12px;padding-left:16px;border-left:1px solid var(--line)}.empty{text-align:center;padding:35px 10px;color:var(--muted)}.previewcard{aspect-ratio:1/1;padding:28px!important;margin-top:16px;display:flex;flex-direction:column;justify-content:center}.previewcard .num{font-size:82px}.mutedlink{color:var(--muted);font-size:12px}.widgetsample{margin:12px auto;padding:20px;width:100%;border-radius:22px;background:var(--soft)}.widgetsample h3{margin:0;font-size:15px}.widgetsample strong{font-size:46px;font-weight:500}.danger{color:var(--error)}.required{color:var(--error)}.smalltitle{font-size:13px;font-weight:500;margin:18px 0 6px}
@media(max-width:1000px){.shell{grid-template-columns:190px minmax(320px,420px);justify-content:center}.notes{grid-column:1/-1;max-width:680px}}@media(max-width:650px){.shell{display:block;margin:20px auto;padding:0 12px;max-width:440px}.menu{display:flex;gap:6px;overflow-x:auto;margin:16px 0}.menu button{white-space:nowrap;font-size:12px;padding:8px 12px}.intro h1{font-size:19px}.intro p{font-size:12px}.phone{border-radius:20px}.notes{margin:22px 8px}.content{padding:0 16px 20px}.appbar{padding:12px 16px}.hero{padding:22px}.calendar{gap:3px}.calendar span,.calendar button{height:34px}.fieldrow{gap:8px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s ease}}@media print{.shell{display:block;margin:0;max-width:430px}.intro,.notes,.menu{display:none}.phone{box-shadow:none}.content{min-height:0}}
</style></head><body>
<main class="shell"><aside class="intro"><div class="eyebrow">ANDROID PRODUCT DESIGN</div><h1>倒数日 页面原型 v1.1</h1><p>交互与视觉评审用示例，不是可安装 App。所有日期固定在 2026 年 10 月 31 日，无网络请求，不保存真实资料。</p><nav class="menu" aria-label="原型页面"></nav></aside><section class="phone" aria-label="Android 应用示例"><div class="status"><span>9:41</span><span>▰  ▰  100%</span></div><div id="screen"></div></section><aside class="notes" id="notes"></aside></main><div id="toast" role="status"></div>
<script>
const pages=[['welcome','首次使用'],['home','首页'],['books','全部本'],['detail','一级事件详情'],['detail-child','二级事件详情'],['detail-leaf','三级事件详情'],['edit','创建与编辑'],['goal','目标与行动'],['calendar','月历'],['share','分享卡片'],['backup','备份与恢复'],['import','导入预览'],['reminders','提醒诊断'],['widgets','桌面组件'],['settings','本地与隐私'],['trash','回收站']];
let active='home',stack=[],messageVisible=true,filter='全部';
const notes={welcome:['首次使用','不收集身份信息。先创建或导入，提醒权限在实际使用时再请求。','P00 → P01 / P12'],home:['首页','默认展示主事件。重点卡片和置顶独立；最近日期按下一发生日排序。新增“正在纪念”分区承接普通正数事件，待产品批准。','P01 → P02 / P03 / P04 / P05'],books:['本与层级','本不是事件层级。每个子树属于同一本，移动时整体更新。长按进入批量管理。','P02 → P03'],detail:['事件详情','单段事件寄语可编辑，没有纸条列表。直属子事件手动添加，最多三层；第三层隐藏新增入口。','P03 → P04 / P05 / P10'],edit:['创建与编辑','标题和日期必填。高级项折叠，保存先写本地数据库，再异步安排提醒。权限拒绝不丢失草稿。','P04 → 保存后 P03'],goal:['目标与行动','行动记录只属于目标。阶段使用子事件，不自动生成。父目标完成不级联完成子目标。','P05 → P04 / 行动编辑弹层'],calendar:['月历','按统一日期引擎计算当月发生日，不为重复事件批量创建业务记录。点日期后显示当天列表。','P06 → P03'],share:['分享卡片','静态示例卡片。寄语为空或关闭时，布局重新居中。原型只演示布局，不生成分享文件。','P10 → 系统分享'],backup:['备份与恢复','完整备份与文本副本分开。恢复前预览，默认合并；替换必须二次确认，提醒默认暂停。','P11 → P12'],import:['导入预览','所有写入前校验引用、三层深度、日期与上限。JSON 原子导入；CSV 可明确选择仅导入有效行。','P12 → 导入结果'],reminders:['提醒诊断','区分系统通知、精确提醒权限和已安排范围。这里展示权限不足示例，不会更改电脑权限。','P13 → Android 系统设置'],widgets:['桌面组件','单事件和最近列表。默认隐藏寄语和照片，隐私独立控制；系统决定刷新时间。','P14 → 系统组件配置'],settings:['本地与隐私','没有账号中心。应用锁不是登录，无法通过邮箱找回。用户文件与外部日历不随本地清理自动删除。','P07 → P11 / P13 / P14 / P15'],trash:['回收站','示例保留 30 天。恢复父事件不抹掉子事件原有归档或删除原因。永久删除前提示备份。','P15 → 恢复后 P03']};
const nav=(sel='home')=>`<nav class="nav" aria-label="底部导航"><button class="${sel==='home'?'active':''}" data-go="home"><span>▣</span>首页</button><button class="${sel==='calendar'?'active':''}" data-go="calendar"><span>▦</span>日历</button><button class="${sel==='settings'?'active':''}" data-go="settings"><span>○</span>我的</button></nav>`;
const bar=(title,back=false,right='')=>`<header class="appbar">${back?'<button class="icon" data-back aria-label="返回">‹</button>':''}<h2 style="flex:1">${title}</h2>${right}</header>`;
const row=(icon,title,sub,count,go='detail')=>`<button class="row" data-go="${go}"><span class="tile">${icon}</span><span class="body"><h4>${title}</h4><p>${sub}</p></span><span class="count">${count}${/^\d+$/.test(count)?'<small>天</small>':''}</span></button>`;
const hero=(detail=false)=>`<${detail?'div':'button'} class="hero" ${detail?'':'data-go="detail"'}><span class="hint">纪念日本 · 已在一起</span><h3>我们的纪念日</h3><div><span class="num">730</span><span class="unit">天</span></div><div class="detaildate">2024 年 10 月 31 日起 · 从第 0 天开始</div>${detail?'':'<p class="message">平凡的日子，也值得认真收藏。</p>'}</${detail?'div':'button'}>`;

const eventSamples={
 detail:{id:'root',level:1,title:'我们的纪念日',path:'纪念日本 / 我们的纪念日',num:'730',unit:'天',label:'已在一起',date:'2024 年 10 月 31 日起 · 从第 0 天开始',greeting:'平凡的日子，也值得认真收藏。',child:'detail-child'},
 'detail-child':{id:'child',level:2,title:'一起看第一场雪',path:'纪念日本 / 我们的纪念日 / 一起看第一场雪',num:'45',unit:'天',label:'距离约定还有',date:'2026 年 12 月 15 日 · 一次性倒数',greeting:'期待和你一起，把冬天走成回忆。',child:'detail-leaf'},
 'detail-leaf':{id:'leaf',level:3,title:'准备雪地旅行',path:'纪念日本 / 我们的纪念日 / 一起看第一场雪 / 准备雪地旅行',num:'30',unit:'天',label:'距离出发准备还有',date:'2026 年 11 月 30 日 · 一次性倒数',greeting:'带上围巾、相机，还有好心情。'}
};
notes['detail']=['一级事件详情','只显示直属二级条目；三级内容不在这里展开。点击“一起看第一场雪”进入二级详情。','P03(rootId) → P03(childId)'];
notes['detail-child']=['二级事件详情','只显示直属三级条目。寄语、背景、日期与提醒属于当前二级事件，独立保存。返回回到一级详情。','P03(childId) → P03(leafId)'];
notes['detail-leaf']=['三级事件详情','最深层事件仍有完整日期、背景和单段寄语，但不显示“添加子事件”。不使用内联展开孙级列表。','P03(leafId) → 返回 P03(childId)'];
let editReturn='detail',editParent=null,selectedDetail='detail';
function eventDetail(key){
 const e=eventSamples[key], child=e.child&&eventSamples[e.child];
 return bar('事件详情',true,'<button class="icon" data-edit-current="'+key+'" aria-label="编辑当前事件">✎</button>')+
 '<div class="content" data-event-level="'+e.level+'"><div class="breadcrumb">'+e.path+'</div>'+
 '<div class="hero" style="'+(e.level===2?'background:linear-gradient(145deg,#6c788b,#36445f)':e.level===3?'background:linear-gradient(145deg,#97765d,#5a4938)':'')+'"><span class="hint">'+e.label+' · 第 '+e.level+' 层 / 最多 3 层</span><h3>'+e.title+'</h3><div><span class="num">'+e.num+'</span><span class="unit">'+e.unit+'</span></div><div class="detaildate">'+e.date+'</div></div>'+
 '<div class="sectionhead"><h3>事件寄语</h3><button class="textbtn" data-edit-current="'+key+'">编辑</button></div><p class="quote">'+e.greeting+'</p>'+
 (e.level<3?'<div class="sectionhead"><h3>直属子事件 <span class="hint">'+(child?'1 项':'0 项')+'</span></h3><button class="textbtn" data-add-child="'+key+'">＋ 添加子事件</button></div>'+
 (child?'<div data-direct-children>'+row(e.level===1?'约':'行',child.title,'第 '+child.level+' 层 · '+(child.child?'含 1 个子事件 · 点击进入':'最深层事件 · 点击进入'),child.num,e.child)+'</div>':'<div class="empty">还没有直属子事件，可手动添加。</div>')+
 '<p class="note">这里只显示当前事件的直属下一级，不展开更深条目。</p>':'<p class="note">已到第 3 层，不能再添加子事件。当前事件内容仍可独立编辑。</p>')+
 '<div class="actions"><button class="secondary" data-go="share">分享卡片</button><button class="secondary" data-go="reminders">提醒设置</button></div><button class="textbtn danger" data-go="trash">更多操作与回收站</button></div>';
}

const views={
welcome:()=>bar('留住重要的日子')+`<div class="content"><div class="illustration"><div class="onboardmark"><small>重要的日子</small>31</div></div><h2 style="font-size:24px;font-weight:500">记得期待，也记得纪念</h2><p>生日、约定和目标，放进自己的本里。</p><div class="panel"><h3>资料只保存在这台设备</h3><p class="hint">不需要账号，也没有云端找回。换手机前，请导出完整备份。</p></div><div class="actions" style="display:grid"><button class="primary" data-go="edit">创建第一个倒数日</button><button class="secondary" data-go="backup">导入已有备份</button></div></div>`,
home:()=>bar('重要的日子',false,'<button class="icon" data-action="search" aria-label="搜索">⌕</button><button class="icon" data-go="edit" aria-label="新增">＋</button>')+`<div class="content"><div class="pills">${['全部','生日本','纪念日本','目标本'].map(x=>`<button class="pill ${filter===x?'on':''}" data-filter="${x}">${x}</button>`).join('')}</div>${filter==='全部'||filter==='纪念日本'?hero():''}<div class="sectionhead"><h3>最近的期待</h3><button class="textbtn" data-go="books">全部本 ›</button></div>${filter==='全部'||filter==='生日本'?row('生','妈妈的生日','生日本 · 每年 11 月 7 日','7'):''}${filter==='全部'||filter==='目标本'?row('目','读完 12 本书','目标本 · 2026 年 12 月 31 日','61','goal'):''}${filter==='纪念日本'?row('约','一起看第一场雪','我们的纪念日 › 手动子事件','45'):''}<div class="sectionhead"><h3>正在纪念</h3><span class="hint">已开始的正数事件</span></div>${row('忆','第一次独自旅行','纪念日本 · 2025 年 10 月 31 日起','365')}<p class="note">示例已固定纪念日主卡片。自动模式会选择最近发生的事件。</p></div>`+nav(),
books:()=>bar('全部本',true,'<button class="icon" data-action="newbook" aria-label="新建本">＋</button>')+`<div class="content"><p class="hint">本负责整理，事件最多有三层。</p><div class="bookgrid">${[['生','生日本','8 个事件'],['忆','纪念日本','6 个事件'],['假','假日本','3 个事件'],['目','目标本','2 个目标'],['其','未分类','0 个事件']].map(b=>`<button class="book" data-go="detail"><span class="tile">${b[0]}</span><h3>${b[1]}</h3><p>${b[2]}</p></button>`).join('')}</div><p class="note">点击本进入本内树列表。本原型使用同一事件示例演示详情。</p></div>`,
detail:()=>eventDetail('detail'),
'detail-child':()=>eventDetail('detail-child'),
'detail-leaf':()=>eventDetail('detail-leaf'),
edit:()=>bar('新建倒数日',true,'<button class="textbtn" data-save>保存</button>')+`<form class="content" id="editform"><div class="breadcrumb">保存到 纪念日本 / 无父事件</div><label class="label" for="eventTitle">标题 <span class="required">*</span></label><input id="eventTitle" required value="我们的纪念日"><div class="fieldrow"><div><label class="label" for="eventType">事件类型</label><select id="eventType"><option>纪念日</option><option>生日</option><option>目标</option><option>普通</option></select></div><div><label class="label" for="dateKind">历法</label><select id="dateKind"><option>公历</option><option>农历</option></select></div></div><label class="label" for="eventDate">日期 <span class="required">*</span></label><input id="eventDate" type="date" value="2024-10-31" required><div class="fieldrow"><div><label class="label" for="countMode">显示方式</label><select id="countMode"><option>已经过去</option><option>距离还有</option></select></div><div><label class="label" for="repeat">重复</label><select id="repeat"><option>不重复</option><option>每年</option><option>每月</option><option>每周</option></select></div></div><label class="label" for="greeting">事件寄语</label><textarea id="greeting">平凡的日子，也值得认真收藏。</textarea><span class="hint">一段可编辑的文字，不保留历史版本。</span><div class="panel"><div class="statline"><span>背景</span><button type="button" class="textbtn" data-action="photo">森林绿渐变 ›</button></div><div class="statline"><span>提醒</span><button type="button" class="textbtn" data-go="reminders">提前 7 天及当天 ›</button></div></div><details><summary>高级设置</summary><p class="hint">计数是否包含起始日、首页显示、标签、时区和异常日期处理。</p></details><button type="submit" class="primary" style="margin-top:20px">保存到本机</button></form>`,
goal:()=>bar('目标详情',true,'<button class="icon" data-go="edit" aria-label="编辑目标">✎</button>')+`<div class="content"><div class="breadcrumb">目标本 / 读完 12 本书</div><div class="panel"><span class="badge">进行中</span><h2 style="font-size:24px;font-weight:500">读完 12 本书</h2><p class="hint">2026 年 10 月 1 日至 12 月 31 日</p><p><span style="font-size:44px">61</span> 天后到期</p><div class="progress"><span style="width:50%"></span></div><div class="statline"><span>阶段完成</span><span>1 / 2</span></div><p class="hint">只统计直属目标阶段；已取消、归档或回收站内阶段不计入。</p></div><div class="sectionhead"><h3>阶段目标</h3><button class="textbtn" data-go="edit">＋ 添加</button></div>${row('✓','第一阶段 读完 4 本','已完成','0','goal')}${row('目','第二阶段 读完 8 本','进行中 · 2026 年 11 月 30 日','30','goal')}<div class="sectionhead"><h3>行动记录</h3><button class="textbtn" data-action="action">＋ 记录</button></div><div class="panel"><h3>读完今天的 30 页</h3><p class="hint">2026 年 10 月 31 日 · 40 分钟</p><p>今天的一章很有启发。</p></div><button class="primary" data-action="complete">标记目标完成</button></div>`,
calendar:()=>bar('日历',false,'<button class="textbtn" data-action="calendaradd">关联日历</button>')+`<div class="content"><div class="sectionhead"><button class="icon" data-action="month" aria-label="上个月">‹</button><h3>2026 年 10 月</h3><button class="icon" data-action="month" aria-label="下个月">›</button></div><div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<span class="dow">${x}</span>`).join('')}${['28','29','30',...Array.from({length:31},(_,i)=>String(i+1)),'1'].map((x,i)=>`<button class="${i<3||i===34?'out':x==='31'?'today':[7,15,24].includes(Number(x))?'event':''}" data-day="${x}">${x}</button>`).join('')}</div><div class="sectionhead"><h3 id="selectedday">10 月 31 日 星期六</h3><span class="badge">今天</span></div>${row('忆','我们的纪念日','第 730 天 · 纪念日本','730')}<p class="note">系统日历可能同步到你的外部账号。关联前只复制经确认的标题、日期和提醒。</p></div>`+nav('calendar'),
share:()=>bar('分享卡片',true)+`<div class="content"><div class="pills"><button class="pill on" data-action="ratio">方形</button><button class="pill" data-action="ratio">竖版</button><button class="pill" data-action="ratio">横版</button></div><div class="hero previewcard"><span class="hint">我们的纪念日</span><div><span class="num">730</span><span class="unit">天</span></div><div class="detaildate">2024.10.31 起 · 2026.10.31 生成</div>${messageVisible?'<p class="message">平凡的日子，也值得认真收藏。</p>':''}</div><div class="setting"><span>展示事件寄语</span><button class="switch" role="switch" aria-label="展示事件寄语" aria-checked="${messageVisible}" data-message></button></div><p class="note">卡片是生成时刻的静态图片，不会随着日期自动变化。</p><div class="actions"><button class="secondary" data-action="exportimage">保存图片</button><button class="primary" data-action="shareimage">分享图片</button></div></div>`,
backup:()=>bar('备份与迁移',true)+`<div class="content"><div class="panel"><h3>我的重要日子</h3><div class="statline"><span>事件与行动</span><span>19 个 / 86 条</span></div><div class="statline"><span>背景素材</span><span>24.6 MB</span></div><div class="statline"><span>最后完整备份</span><span>2026 年 10 月 24 日</span></div><p class="hint">此后有修改，建议重新导出。</p></div><h3 class="smalltitle">完整备份</h3><p class="hint">包含本、层级、寄语、背景和行动记录。用于迁移与留存。</p><label class="label" for="backupPassword">设置备份口令</label><input id="backupPassword" type="password" minlength="8" autocomplete="new-password" placeholder="至少 8 个字符，不可找回"><div class="warning" style="margin-top:12px">应用锁和备份口令不同。忘记备份口令后，无法通过邮箱找回文件。</div><div class="actions"><button class="primary" data-action="backup">导出加密备份</button></div><button class="secondary" data-go="import" style="margin-top:10px">恢复已有备份</button><h3 class="smalltitle">纪念日文本副本</h3><p class="hint">用于分享独立副本，不包含图片文件和行动记录。不是完整备份。</p><button class="textbtn" data-go="import">JSON 与 CSV 导入导出 ›</button></div>`,
import:()=>bar('恢复预览',true)+`<div class="content"><span class="badge">校验通过 示例</span><h3 style="margin-bottom:0">重要日子 2026 年 10 月备份</h3><p class="hint">5 个本 · 19 个事件 · 86 条行动 · 24.6 MB 素材</p><div class="panel"><h3>合并到当前资料库</h3><p class="hint">不会按标题覆盖现有事件。重名本先确认映射或自动加后缀。</p><div class="statline"><span>生日本</span><span>合并到现有 生日本</span></div><div class="statline"><span>旅行本</span><span>新增 旅行本</span></div><div class="statline"><span>重复备份条目</span><span>已导入的默认跳过</span></div></div><div class="warning">恢复后所有导入提醒暂时关闭。桌面组件和日历绑定需要重新确认。</div><div class="setting"><span>恢复方式</span><select aria-label="恢复方式" style="width:150px"><option>合并</option><option>替换全部</option></select></div><button class="primary" data-action="restore" style="margin-top:20px">确认恢复</button><p class="note">替换时另外确认删除范围。失败或取消不会切换到半份资料。</p></div>`,
reminders:()=>bar('提醒诊断',true)+`<div class="content"><div class="warning">事件已保存在本机，但系统通知权限尚未开启。当前不会显示提醒。</div><div class="panel"><div class="setting"><span>系统通知</span><button class="textbtn" data-action="permission">去开启 ›</button></div><div class="setting"><span>准时提醒访问</span><span class="badge warn">未允许</span></div><div class="setting"><span>电池后台限制</span><span class="hint">由系统管理</span></div></div><h3 class="smalltitle">计划状态</h3><div class="statline"><span>业务提醒规则</span><span>20 条</span></div><div class="statline"><span>当前系统唤醒任务</span><span>0 个</span></div><div class="statline"><span>未来计划范围</span><span>未安排</span></div><p class="note">允许通知后按最近提醒重建。普通提醒可能延迟；准时提醒另需系统授权。强行停止、关机和厂商限制可能影响送达。</p><button class="secondary" data-action="repair">检查并重新安排</button><div class="sectionhead"><h3>生日提醒默认值</h3></div><div class="panel"><p>提前 7 天 · 当天</p><p class="hint">跟随本机日期 · 上午 09:00</p></div></div>`,
widgets:()=>bar('桌面组件',true)+`<div class="content"><div class="pills"><button class="pill on" data-action="widget">单事件</button><button class="pill" data-action="widget">最近列表</button></div><div class="widgetsample"><p class="hint">生日本</p><h3>妈妈的生日</h3><strong>7</strong><span> 天后</span><p class="hint">11 月 7 日 · 每年重复</p></div><div class="panel"><div class="setting"><span>显示寄语与照片</span><button class="switch" role="switch" aria-label="显示寄语与照片" aria-checked="false" data-toggle></button></div><p class="hint">开启后可在 App 外被看到。锁屏组件是否可添加取决于设备，不承诺所有 Android 手机都支持。</p></div><button class="primary" data-action="addwidget">添加到桌面</button><p class="note">日期变化、资料编辑后请求刷新，由系统安排实际更新时间。无秒级刷新承诺。</p></div>`,
settings:()=>bar('我的')+`<div class="content"><div class="panel"><h3>我的重要日子</h3><p class="hint">本地资料库 · 无账号</p><div class="statline"><span>19 个事件</span><span>24.6 MB</span></div></div>${row('备','备份与迁移','最后备份后有修改','›','backup')}${row('铃','提醒诊断','权限不足，需处理','›','reminders')}${row('组','桌面组件','单事件与最近列表','›','widgets')}<div class="setting"><span>应用锁</span><button class="switch" role="switch" aria-label="应用锁" aria-checked="false" data-toggle></button></div><div class="setting"><span>通知隐藏标题</span><button class="switch" role="switch" aria-label="通知隐藏标题" aria-checked="true" data-toggle></button></div><div class="setting"><span>主题</span><span class="hint">跟随系统</span></div><button class="row" data-go="trash"><span class="body"><h4>回收站</h4><p>30 天后清理 示例</p></span><span>›</span></button><button class="textbtn" data-action="tools">日期计算工具</button><p class="note">清除数据或卸载后，没有云端恢复。导出的文件、外部日历副本需要在对应位置另行管理。</p></div>`+nav('settings'),
trash:()=>bar('回收站',true,'<button class="textbtn danger" data-action="purge">清空</button>')+`<div class="content"><p class="hint">示例保留 30 天。永久删除前可先完整备份。</p><div class="panel"><h3>春日旅行</h3><p class="hint">包含 2 个子事件 · 还剩 23 天</p><p class="hint">子事件原有的单独归档状态会保留。</p><div class="actions"><button class="secondary" data-action="recover">恢复整个子树</button><button class="secondary danger" data-action="purge">永久删除</button></div></div><div class="empty">删除不会影响你之前分享的图片<br>或外部日历中的副本。</div></div>`};
function show(id,push=true){if(!views[id])return;if(push&&active!==id)stack.push(active);if(eventSamples[id])selectedDetail=id;active=id;document.getElementById('screen').innerHTML=views[id]();document.querySelector('.menu').innerHTML=pages.map(([key,label])=>`<button data-go="${key}" aria-current="${active===key?'page':'false'}">${label}</button>`).join('');if(id==='share'){const e=eventSamples[selectedDetail];document.querySelector('.previewcard .hint').textContent=e.title;document.querySelector('.previewcard .num').textContent=e.num;document.querySelector('.previewcard .detaildate').textContent=e.date+' · 2026.10.31 生成';const m=document.querySelector('.previewcard .message');if(m)m.textContent=e.greeting;}const n=notes[id];document.getElementById('notes').innerHTML=`<h3>${n[0]}</h3><p>${n[1]}</p><code>${n[2]}</code><ul><li>详情层级交互已按 v1.1 固定为点击逐级进入；配色仍为视觉方向。</li><li>这是交互示意，系统授权、保存、删除和恢复不会真实执行。</li><li>支持 320 px 起自适应；真实 App 使用 dp 与 sp。</li></ul>`;history.replaceState(null,'','#'+id)}
function validateDraft(f){const seg=new Intl.Segmenter('zh',{granularity:'grapheme'});const title=document.getElementById('eventTitle'),g=document.getElementById('greeting');title.setCustomValidity([...seg.segment(title.value)].length>60?'标题最多60个可见字符':'');g.setCustomValidity([...seg.segment(g.value)].length>2000?'寄语最多2000个可见字符':'');return f.reportValidity();}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2800)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.editCurrent||b.dataset.addChild){editReturn=b.dataset.editCurrent||b.dataset.addChild;editParent=b.dataset.addChild||null;show('edit');const e=eventSamples[editReturn];document.getElementById('eventTitle').value=editParent?'':e.title;document.querySelector('.appbar h2').textContent=editParent?'添加直属子事件':'编辑当前事件';document.querySelector('#editform .breadcrumb').textContent='保存到 '+(editParent?e.path:'纪念日本 / '+(e.level===1?'无父事件':e.level===2?'我们的纪念日':'我们的纪念日 / 一起看第一场雪'));document.getElementById('greeting').value=editParent?'':e.greeting;document.getElementById('eventDate').value=editParent?'':e.level===1?'2024-10-31':e.level===2?'2026-12-15':'2026-11-30';document.getElementById('countMode').selectedIndex=e.level===1?0:1;return}if(b.dataset.go){if(b.dataset.go==='edit'){editReturn='detail';editParent=null}show(b.dataset.go);return}if(b.hasAttribute('data-back')){show(stack.pop()||'home',false);return}if(b.dataset.filter){filter=b.dataset.filter;show('home',false);return}if(b.hasAttribute('data-message')){messageVisible=!messageVisible;show('share',false);return}if(b.hasAttribute('data-toggle')){b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true');toast('仅切换原型状态，不更改系统设置');return}if(b.hasAttribute('data-save')){const f=document.getElementById('editform');if(validateDraft(f)){toast('原型保存成功示意，不持久化');show(editReturn)}return}if(b.dataset.day){document.getElementById('selectedday').textContent=`10 月 ${b.dataset.day} 日 示例`;toast('日期选择示意，列表保持示例资料');return}if(b.dataset.action){const a=b.dataset.action;if(a==='ratio'){document.querySelectorAll('.pills .pill').forEach(x=>x.classList.toggle('on',x===b));const card=document.querySelector('.previewcard');card.style.aspectRatio=b.textContent==='方形'?'1/1':b.textContent==='竖版'?'3/4':'4/3';return}if(a==='backup'&&(Array.from(document.getElementById('backupPassword').value).length<8||new TextEncoder().encode(document.getElementById('backupPassword').value).length>1024)){toast('备份口令至少8个字符，UTF8不超过1024字节');return}const text={search:'搜索原型范围：标题、寄语、本与标签',newbook:'新建本：名称必填且在本机资料库内唯一',photo:'真实 App 调用系统照片选择器',action:'行动记录：日期、文字和可选分钟数',complete:'需确认：只完成当前目标，不自动完成子目标',calendaradd:'真实 App 打开系统日历编辑器，需提示外部同步风险',month:'月份切换示意，日期样例固定为 2026 年 10 月',exportimage:'真实 App 通过系统文件选择器保存卡片',shareimage:'真实 App 打开 Android 系统分享，不自动发送',backup:'真实 App 会加密导出，原型不创建任何文件',restore:'真实 App 在校验和二次确认后原子切换资料库',permission:'真实 App 打开 Android 通知设置',repair:'重新检查权限、重建计划，不保证系统准时送达',widget:'组件类型切换示意',addwidget:'真实 App 请求系统添加组件，不支持时显示手动说明',tools:'日期差值、日期推算与周一至周五计数',purge:'破坏性操作必须二次确认，原型不会删除资料',recover:'恢复操作示意，原型不会修改资料'};toast(text[a]||'原型交互示意')}});
document.addEventListener('submit',e=>{e.preventDefault();if(validateDraft(e.target)){toast('原型保存成功示意，不持久化');show(editReturn)}});show(views[location.hash.slice(1)]?location.hash.slice(1):'home',false);
</script></body></html>
